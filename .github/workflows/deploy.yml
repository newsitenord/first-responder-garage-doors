# Optional (but recommended) deploy path.
#
# Why this exists: Cloudflare Pages builds time out at 20 minutes and its
# "Next.js" framework preset tries to run @cloudflare/next-on-pages, which does
# not support `output: 'export'`. This workflow builds on GitHub's runners
# (6-hour limit) and uploads the finished `out/` folder with wrangler, so the
# Pages project never has to build the 14k pages itself.
#
# Setup: repo Settings -> Secrets and variables -> Actions
#   CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#   CLOUDFLARE_ACCOUNT_ID  (dashboard URL or `npx wrangler whoami`)
# Then: Actions tab -> "Deploy to Cloudflare Pages" -> Run workflow.
# After the first run, disable Cloudflare's own Git build (Pages -> Settings ->
# Build -> "None") so the two pipelines don't fight.

name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://first-responder-garage-doors.pages.dev
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Sanity check output
        run: |
          test -f out/index.html || (echo "FAIL: out/index.html missing" && exit 1)
          echo "html pages: $(find out -name '*.html' | wc -l)"
          echo "total files: $(find out -type f | wc -l)"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=first-responder-garage-doors --branch=main
